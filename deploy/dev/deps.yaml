# Local-only backing services for the kind cluster (namespace bodega-dev).
# Production uses CloudNativePG, a real SeaweedFS cluster and the NATS Helm chart.
# Credentials here are throwaway dev values.
apiVersion: v1
kind: Secret
metadata:
  name: bodega-dev-secrets
stringData:
  BODEGA_DATABASE_URL: postgres://bodega:bodega@postgres:5432/bodega?sslmode=disable
  # Tilt scrubs secret values from its logs, so they must not be common words:
  # an access key of "bodega" blanked every "pepes-bodega" in the Tilt UI.
  BODEGA_S3_ACCESS_KEY: pdv-s3-ak-7c41
  BODEGA_S3_SECRET_KEY: pdv-s3-sk-e93b0d
  BODEGA_OIDC_CLIENT_SECRET: bodega-dev-oidc-secret
---
# ---------------- Postgres + pgvector ----------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          env:
            - { name: POSTGRES_USER, value: bodega }
            - { name: POSTGRES_PASSWORD, value: bodega }
            - { name: POSTGRES_DB, value: bodega }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "bodega"] }
            periodSeconds: 3
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  type: NodePort
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432, nodePort: 30432 }]
---
# ---------------- SeaweedFS (single-node, S3 gateway) ----------------
apiVersion: v1
kind: ConfigMap
metadata: { name: seaweedfs-s3 }
data:
  s3.json: |
    {"identities":[{"name":"bodega","credentials":[
      {"accessKey":"pdv-s3-ak-7c41","secretKey":"pdv-s3-sk-e93b0d"},
      {"accessKey":"bodega","secretKey":"bodega-dev-secret"}],
      "actions":["Admin","Read","Write","List","Tagging"]}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector: { matchLabels: { app: seaweedfs } }
  template:
    metadata:
      labels: { app: seaweedfs }
      # SeaweedFS reads s3.json only at start; bump to roll it after edits.
      # The second credential is the pre-rev-2 key, kept so pods still holding
      # the old secret in their env keep working until they restart.
      annotations: { bodega/s3-config-rev: "2" }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json",
                 "-volume.max=0", "-master.volumeSizeLimitMB=1024", "-ip.bind=0.0.0.0"]
          ports: [{ containerPort: 8333 }]
          readinessProbe:
            tcpSocket: { port: 8333 }
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3, mountPath: /etc/seaweedfs }
      volumes:
        - name: s3
          configMap: { name: seaweedfs-s3 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: seaweedfs }
spec:
  type: NodePort
  selector: { app: seaweedfs }
  ports: [{ name: s3, port: 8333, targetPort: 8333, nodePort: 30333 }]
---
# ---------------- NATS JetStream ----------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  serviceName: nats
  replicas: 1
  selector: { matchLabels: { app: nats } }
  template:
    metadata: { labels: { app: nats } }
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - { name: client, containerPort: 4222 }
            - { name: monitor, containerPort: 8222 }
          readinessProbe:
            httpGet: { path: "/healthz?js-enabled-only=true", port: 8222 }
            periodSeconds: 3
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: nats }
spec:
  selector: { app: nats }
  ports:
    - { name: client, port: 4222 }
    - { name: monitor, port: 8222 }
---
apiVersion: v1
kind: Service
metadata: { name: nats-monitor-nodeport }
spec:
  type: NodePort
  selector: { app: nats }
  ports: [{ name: monitor, port: 8222, nodePort: 30222 }]
---
# ---------------- Dex (OIDC) ----------------
# __DEX_ISSUER__ and __BODEGA_PUBLIC_URL__ are filled in by the Tiltfile: the
# URLs the *browser* uses (localhost, or the netbird-exposed https URLs). The API
# reaches Dex in-cluster via http://dex:5556 (BODEGA_OIDC_INTERNAL_URL).
# Login: pepe@bodega.local / sangria
apiVersion: v1
kind: ConfigMap
metadata: { name: dex }
data:
  config.yaml: |
    issuer: __DEX_ISSUER__
    storage: { type: memory }
    web: { http: 0.0.0.0:5556 }
    oauth2: { skipApprovalScreen: true }
    enablePasswordDB: true
    staticPasswords:
      - email: pepe@bodega.local
        # bcrypt("sangria")
        hash: "$2b$10$6ig6dEcTd.R4l86vZqtvg.vmFsHzWsn32wQXE.g2rB1X2eMzr/36W"
        username: pepe
        userID: 0f9c6e5a-2f3c-4e7e-9d2a-5e0b1c1d0001
      - email: stig-helmer@bodega.local
        # bcrypt("sangria")
        hash: "$2b$10$6ig6dEcTd.R4l86vZqtvg.vmFsHzWsn32wQXE.g2rB1X2eMzr/36W"
        username: stig-helmer
        userID: 0f9c6e5a-2f3c-4e7e-9d2a-5e0b1c1d0002
    staticClients:
      - id: bodega
        name: Pepes Bodega
        secret: bodega-dev-oidc-secret
        redirectURIs: ["__BODEGA_PUBLIC_URL__/auth/callback", "http://localhost:8080/auth/callback"]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: dex }
spec:
  replicas: 1
  selector: { matchLabels: { app: dex } }
  template:
    metadata:
      labels: { app: dex }
      # Dex only reads its config at start; a new issuer must roll the pod.
      annotations: { bodega/issuer: "__DEX_ISSUER__" }
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:latest
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports: [{ containerPort: 5556 }]
          readinessProbe:
            httpGet: { path: /.well-known/openid-configuration, port: 5556 }
            periodSeconds: 3
          volumeMounts: [{ name: config, mountPath: /etc/dex }]
      volumes:
        - name: config
          configMap: { name: dex }
---
apiVersion: v1
kind: Service
metadata: { name: dex }
spec:
  type: NodePort
  selector: { app: dex }
  ports: [{ port: 5556, targetPort: 5556, nodePort: 30556 }]
